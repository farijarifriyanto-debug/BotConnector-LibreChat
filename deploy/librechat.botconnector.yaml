summarization:
  enabled: true
  maxSummaryTokens: 4096
  reserveRatio: 0.05
  trigger:
    type: token_ratio
    value: 0.8
  retainRecent:
    turns: 2
    tokens: 2000
  contextPruning:
    enabled: true
    keepLastAssistants: 3
    softTrimRatio: 0.3
    hardClearRatio: 0.5
    minPrunableToolChars: 50000
webSearch:
  searchProvider: keenable
  scraperProvider: keenable
  rerankerType: cohere
  safeSearch: 1
  scraperTimeout: 10000
  keenableSearchOptions:
    maxResults: 8
    attributionTitle: BotConnector
    timeout: 15000
  keenableScraperOptions:
    attributionTitle: BotConnector
    timeout: 15000
  cohereApiKey: ${COHERE_API_KEY}
mcpServers:
  fetch:
    type: stdio
    command: /home/botadmin/.local/bin/uvx
    args:
    - mcp-server-fetch
  sequential-thinking:
    type: stdio
    command: node
    args:
    - /home/botadmin/.local/share/mcp-servers/sequential-thinking/node_modules/.bin/mcp-server-sequential-thinking
  desktop-commander:
    type: streamable-http
    url: https://mcp.desktopcommander.app/mcp
    requiresOAuth: true
    oauth:
      send_resource_parameter: false
    initTimeout: 30000
    timeout: 120000
fileConfig:
  endpoints:
    BotConnector:
      textFallbackWithoutTools: true
      defaultLLMDeliveryPath:
        overrides:
          application/pdf: text
endpoints:
  all:
    maxToolResultChars: 50000
  agents:
    disableBuilder: true
    recursionLimit: 20
    maxRecursionLimit: 25
    capabilities:
    - deferred_tools
    - file_search
    - execute_code
    - programmatic_tools
    - web_search
    - artifacts
    - subagents
    - run_in_background
    - actions
    - context
    - skills
    - memory
    - ask_user_question
    - tools
    - chain
    - tool_intents
    - ocr
    maxSubagents: 10
    toolApproval:
      enabled: true
      mode: bypass
      allow:
      - execute_code
      - web_search
      - file_search
      - tool_search
      - skill
      - ask_user_question
      - subagent
      - check_background_task
      - publish_artifact
      - set_memory
      - delete_memory
      - mcp:fetch:*
      - mcp:sequential-thinking:*
      ask:
      - mcp:desktop-commander:*
      reason: Review {tool} before it runs.
    checkpointer:
      type: mongo
      ttl: 86400
    backgroundTasks:
      ordinaryToolCancellation: true
  custom:
  - name: BotConnector
    apiKey: ${BOTCONNECTOR_BRIDGE_API_KEY}
    baseURL: ${BOTCONNECTOR_BRIDGE_BASE_URL}
    headers:
      X-BotConnector-User-ID: '{{LIBRECHAT_USER_OPENIDID}}'
    models:
      default:
      - default
      fetch: true
    titleConvo: true
    titleModel: default
    modelDisplayLabel: BotConnector
    programmaticMcpServers:
    - fetch
    - sequential-thinking
    tokenConfig:
      agnes-3.0-flash:
        prompt: 0
        completion: 0
        context: 524288
