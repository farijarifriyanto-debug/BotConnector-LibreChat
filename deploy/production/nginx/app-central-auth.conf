# Include these exact locations in the app.botconnector.id TLS server before the generic location / block.
# Local LibreChat registration/email-login are disabled by deploy/production/librechat.production.env.

location = /login {
    return 302 /oauth/openid;
}

location = /register {
    return 302 https://botconnector.id/register;
}

location = /forgot-password {
    return 302 https://botconnector.id/forgot-password;
}

location = /reset-password {
    return 302 https://botconnector.id/forgot-password;
}
