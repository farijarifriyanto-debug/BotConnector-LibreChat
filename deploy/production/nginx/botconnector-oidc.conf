# Include these locations in the botconnector.xyz TLS server before the generic location / block.
# The trailing slash on proxy_pass intentionally strips /botconnector-oidc/ before forwarding.

location = /botconnector-oidc {
    return 308 /botconnector-oidc/;
}

location ^~ /botconnector-oidc/ {
    proxy_pass http://127.0.0.1:18442/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
}
