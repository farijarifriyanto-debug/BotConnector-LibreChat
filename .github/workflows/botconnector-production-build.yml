name: BotConnector LibreChat Production Build

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "client/**"
      - "packages/**"
      - "skill/**"
      - "librechat.yaml"
      - "deploy/librechat.botconnector.yaml"
      - "deploy/librechat-bridge/**"
      - "deploy/production/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/botconnector-production-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "client/**"
      - "packages/**"
      - "skill/**"
      - "librechat.yaml"
      - "deploy/librechat.botconnector.yaml"
      - "deploy/librechat-bridge/**"
      - "deploy/production/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/botconnector-production-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: botconnector-librechat-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  SCARF_ANALYTICS: "false"
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build:data-provider
          npm run build:data-schemas
          npm run build:client-package

      - name: Test native LibreChat agent and file routing
        working-directory: packages/api
        run: |
          npx jest \
            src/agents/__tests__/load.spec.ts \
            src/agents/load.spec.ts \
            src/agents/files/delivery.spec.ts \
            src/agents/files/session.spec.ts \
            --runInBand --coverage=false

      - name: Test upstream bounded tokenizer counting
        working-directory: packages/api
        run: npx jest src/utils/tokenizer.spec.ts --runInBand --coverage=false

      - name: Test native LibreChat delivery resolver and custom endpoint schema
        working-directory: packages/data-provider
        run: |
          npx jest \
            src/resolve-llm-delivery-path.spec.ts \
            src/config.programmatic-mcp.spec.ts \
            --runInBand --coverage=false

      - name: Test native LibreChat upload menu
        working-directory: client
        run: npx jest src/components/Chat/Input/Files/__tests__/AttachFileMenu.spec.tsx --runInBand --coverage=false

      - name: Build API and client
        run: |
          npm run build:api
          npm run build:client

      - name: Validate canonical production promoter and bridge
        run: |
          bash -n deploy/production/promote-librechat.sh
          node --check deploy/librechat-bridge/server.cjs

      - name: Validate production identity and Local Trial contract
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'ALLOW_EMAIL_LOGIN=false' deploy/production/librechat.production.env
          grep -qx 'ALLOW_REGISTRATION=false' deploy/production/librechat.production.env
          grep -q "model: qwen3-0.6b-local-trial" deploy/librechat.botconnector.yaml
          grep -q "model: qwen2.5-coder-0.5b-local-trial" deploy/librechat.botconnector.yaml
          grep -q "model: smolvlm2-500m-local-trial" deploy/librechat.botconnector.yaml
          ! grep -q "qwen3-1.7b-local-trial" deploy/librechat.botconnector.yaml
          ! grep -q "qwen2.5-coder-1.5b-local-trial" deploy/librechat.botconnector.yaml
          ! grep -q "smolvlm2-2.2b-local-trial" deploy/librechat.botconnector.yaml

      - name: Package production build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output
          printf "%s\n" "commit=${GITHUB_SHA}" "built_at=$(date -u +%FT%TZ)" > build-output/manifest.txt
          test "$(node -p "require('./node_modules/@librechat/agents/package.json').version")" = "3.9.3"
          tar -czf build-output/botconnector-librechat-build.tar.gz \
            api \
            node_modules/@librechat/agents \
            packages/data-provider/dist \
            packages/data-schemas/dist \
            packages/api/dist \
            packages/client/dist \
            deploy/librechat.botconnector.yaml \
            deploy/librechat-bridge/server.cjs \
            deploy/production/librechat.production.env \
            client/dist

      - name: Upload production build
        uses: actions/upload-artifact@v6
        with:
          name: botconnector-librechat-build-${{ github.sha }}
          path: build-output/
          if-no-files-found: error
          retention-days: 7

# Heavy LibreChat builds run on GitHub-hosted runners; the VPS only promotes validated artifacts.
