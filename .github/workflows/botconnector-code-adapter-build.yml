name: BotConnector Code Adapter Build

on:
  push:
    branches: [main]
    paths:
      - "deploy/code-adapter/**"
      - ".github/workflows/botconnector-code-adapter-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/code-adapter/**"
      - ".github/workflows/botconnector-code-adapter-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: botconnector-code-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deploy/code-adapter/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r deploy/code-adapter/requirements.txt
          python -m pip install pytest

      - name: Validate Python sources
        run: |
          python -m py_compile             deploy/code-adapter/app.py             deploy/code-adapter/ptc.py             deploy/code-adapter/vendor/ptc_server.py             deploy/code-adapter/vendor/ptc_bash_server.py

      - name: Test LibreChat PTC protocol
        working-directory: deploy/code-adapter
        run: pytest -q tests

      - name: Build adapter image
        run: |
          docker build             -f deploy/code-adapter/Dockerfile             -t botconnector/code-adapter:${GITHUB_SHA}             .

      - name: Smoke import PTC module
        run: |
          docker run --rm             botconnector/code-adapter:${GITHUB_SHA}             python -c "import ptc; print('PTC adapter import OK')"

      - name: Export deployable image artifact
        run: |
          mkdir -p build-output
          docker save botconnector/code-adapter:${GITHUB_SHA}             | gzip -1 > build-output/botconnector-code-adapter.tar.gz
          printf "%s\n"             "commit=${GITHUB_SHA}"             "image=botconnector/code-adapter:${GITHUB_SHA}"             "built_at=$(date -u +%FT%TZ)"             > build-output/manifest.txt

      - uses: actions/upload-artifact@v6
        with:
          name: botconnector-code-adapter-${{ github.sha }}
          path: build-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
