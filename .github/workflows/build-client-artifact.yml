name: Build LibreChat client artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build frontend
        run: npm run frontend

      - name: Verify BotConnector home link
        run: grep -R "https://botconnector.id" client/dist

      - name: Upload client dist
        uses: actions/upload-artifact@v4
        with:
          name: botconnector-librechat-client-dist
          path: client/dist/
          if-no-files-found: error
          retention-days: 7
