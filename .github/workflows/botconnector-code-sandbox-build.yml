name: BotConnector Code Sandbox Build

on:
  push:
    branches: [main]
    paths:
      - "deploy/code-sandbox/**"
      - ".github/workflows/botconnector-code-sandbox-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/code-sandbox/**"
      - ".github/workflows/botconnector-code-sandbox-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: botconnector-code-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build sandbox image
        run: |
          docker build \
            -f deploy/code-sandbox/Dockerfile \
            -t botconnector/opensandbox-python-office:${GITHUB_SHA} \
            .

      - name: Verify Office and Python document libraries
        run: |
          set -euo pipefail
          IMAGE="botconnector/opensandbox-python-office:${GITHUB_SHA}"
          docker run --rm --network none "$IMAGE" libreoffice --headless --version
          docker run --rm --network none "$IMAGE" jq --version
          docker run --rm --network none "$IMAGE" python3 -c "import docx, openpyxl, pptx, reportlab, pypdf, pandas, numpy, matplotlib; print('python document stack OK')"

      - name: Smoke test DOCX to PDF
        run: |
          set -euo pipefail
          IMAGE="botconnector/opensandbox-python-office:${GITHUB_SHA}"
          mkdir -p .sandbox-smoke
          chmod 777 .sandbox-smoke

          docker run --rm --network none \
            -v "$PWD/.sandbox-smoke:/mnt/data" \
            "$IMAGE" \
            python3 -c "from docx import Document; d=Document(); d.add_heading('BotConnector Code Interpreter', 0); d.add_paragraph('GitHub runner DOCX to PDF smoke test.'); d.save('/mnt/data/smoke.docx')"

          docker run --rm --network none \
            -v "$PWD/.sandbox-smoke:/mnt/data" \
            "$IMAGE" \
            libreoffice --headless --convert-to pdf --outdir /mnt/data /mnt/data/smoke.docx

          test -s .sandbox-smoke/smoke.pdf
          file .sandbox-smoke/smoke.pdf

      - name: Export image
        run: |
          set -euo pipefail
          mkdir -p build-output
          docker tag \
            "botconnector/opensandbox-python-office:${GITHUB_SHA}" \
            botconnector/opensandbox-python-office:2
          docker save botconnector/opensandbox-python-office:2 \
            | gzip -1 > build-output/botconnector-opensandbox-python-office-v2.tar.gz
          printf "%s\n" \
            "commit=${GITHUB_SHA}" \
            "image=botconnector/opensandbox-python-office:2" \
            "built_at=$(date -u +%FT%TZ)" \
            > build-output/manifest.txt

      - name: Split sandbox artifact for remote canary transfer
        run: |
          set -euo pipefail
          mkdir -p build-output/chunks
          sha256sum build-output/botconnector-opensandbox-python-office-v2.tar.gz             > build-output/chunks/SHA256SUMS
          split -b 48M -d -a 2             build-output/botconnector-opensandbox-python-office-v2.tar.gz             build-output/chunks/part-
          ls -lh build-output/chunks

      - name: Upload sandbox image artifact
        uses: actions/upload-artifact@v6
        with:
          name: botconnector-code-sandbox-${{ github.sha }}
          path: |
            build-output/manifest.txt
            build-output/chunks/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload sandbox chunk 00
        uses: actions/upload-artifact@v6
        with:
          name: botconnector-code-sandbox-chunk-00-${{ github.sha }}
          path: build-output/chunks/part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload sandbox chunk 01
        uses: actions/upload-artifact@v6
        with:
          name: botconnector-code-sandbox-chunk-01-${{ github.sha }}
          path: build-output/chunks/part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload sandbox chunk 02
        uses: actions/upload-artifact@v6
        with:
          name: botconnector-code-sandbox-chunk-02-${{ github.sha }}
          path: build-output/chunks/part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload sandbox chunk 03
        uses: actions/upload-artifact@v6
        with:
          name: botconnector-code-sandbox-chunk-03-${{ github.sha }}
          path: build-output/chunks/part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload sandbox chunk 04
        uses: actions/upload-artifact@v6
        with:
          name: botconnector-code-sandbox-chunk-04-${{ github.sha }}
          path: build-output/chunks/part-04
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload sandbox chunk 05
        uses: actions/upload-artifact@v6
        with:
          name: botconnector-code-sandbox-chunk-05-${{ github.sha }}
          path: build-output/chunks/part-05
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload sandbox chunk 06
        uses: actions/upload-artifact@v6
        with:
          name: botconnector-code-sandbox-chunk-06-${{ github.sha }}
          path: build-output/chunks/part-06
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload sandbox chunk 07
        uses: actions/upload-artifact@v6
        with:
          name: botconnector-code-sandbox-chunk-07-${{ github.sha }}
          path: build-output/chunks/part-07
          if-no-files-found: error
          compression-level: 0
          retention-days: 7


      - name: Publish deployable image release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="code-sandbox-${GITHUB_SHA::12}"
          ASSET="build-output/botconnector-opensandbox-python-office-v2.tar.gz"
          MANIFEST="build-output/manifest.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$MANIFEST" --clobber
          else
            gh release create "$TAG" "$ASSET" "$MANIFEST" \
              --target "$GITHUB_SHA" \
              --title "BotConnector Code Sandbox ${GITHUB_SHA::12}" \
              --notes "GitHub-built Office-capable sandbox image for native LibreChat Code Interpreter."
          fi
